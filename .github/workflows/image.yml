# Every pull request builds the image for linux/amd64 without pushing it, and runs it once.
# Publishing arrives with the 2.0 release workflow.
name: image

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: openqtt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs
        run: docker run --rm openqtt:ci --help
