# A tag `vX.Y.Z` is a release. It builds the community image, publishes it and
# the chart to GHCR, and creates the GitHub release with the packaged chart
# attached and both digests in the notes. Deployments pin the image digest, not
# the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  mirror-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the builder image if the mirror is missing
        run: |
          set -euo pipefail
          SRC="ghcr.io/emqx/emqx-builder/5.6-2:1.15.7-26.2.5.14-1-debian13"
          DST="ghcr.io/openqtt/emqx-builder:5.6-2-1.15.7-26.2.5.14-1-debian13"
          if docker manifest inspect "$DST" >/dev/null 2>&1; then
            echo "mirror present: $DST"
          else
            docker buildx imagetools create --tag "$DST" "$SRC"
            echo "mirrored $SRC -> $DST"
          fi

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag must match the chart
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION="$(grep -E '^version:' deploy/charts/openqtt/Chart.yaml | awk '{print $2}')"
          if [ "$VERSION" != "$CHART_VERSION" ]; then
            echo "tag v$VERSION but Chart.yaml says $CHART_VERSION; bump the chart first" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ONE BUILD PER ARCHITECTURE, ON ITS OWN ARCHITECTURE. A single job with
  # platforms: linux/amd64,linux/arm64 builds the arm64 half under QEMU, and this
  # release takes 30 to 40 minutes natively, so emulation would run past the
  # timeout. GitHub's arm64 runners are free for public repositories, so each
  # half builds native and a later job stitches them into one manifest.
  #
  # An IoT broker without an arm64 image is the wrong shape: Raspberry Pi,
  # Jetson and Graviton are exactly where a fleet's brokers and gateways run.
  image:
    needs: [mirror-builder, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PUSHED BY DIGEST, NOT BY TAG. Two jobs pushing the same tag would race
      # and the loser's architecture would vanish. Each pushes an untagged image
      # and reports its digest; the merge job names them.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=ghcr.io/openqtt/openqtt,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      # The shell strips the sha256: prefix, not the Actions expression: ${{ }}
      # has no parameter expansion and would emit the literal text.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # THE MANIFEST LIST, which is what a `docker pull` of the tag actually
  # resolves. imagetools copies across registries, so Docker Hub is populated
  # from the images already in GHCR rather than built or pushed a second time.
  #
  # GHCR STAYS CANONICAL. Docker Hub rate-limits anonymous pulls in a way GHCR
  # does not, and a Kubernetes cluster re-pulls on every scale-up and node
  # replacement. Docker Hub is here because people search it; the chart default
  # and the docs point at GHCR.
  manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create the manifest in both registries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          SOURCES=$(printf 'ghcr.io/openqtt/openqtt@sha256:%s ' *)
          echo "combining: $SOURCES"
          docker buildx imagetools create \
            --tag "ghcr.io/openqtt/openqtt:${VERSION}" \
            --tag "ghcr.io/openqtt/openqtt:sha-${GITHUB_SHA}" \
            $SOURCES
          docker buildx imagetools create \
            --tag "docker.io/openqtt/openqtt:${VERSION}" \
            --tag "docker.io/openqtt/openqtt:latest" \
            $SOURCES
      - id: digest
        name: The digest deployments pin
        run: |
          set -euo pipefail
          D=$(docker buildx imagetools inspect \
                "ghcr.io/openqtt/openqtt:${{ needs.version.outputs.version }}" \
                --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "manifest digest: $D"
      # PARSE THE INDEX, DO NOT GREP IT. --raw emits formatted JSON, so
      # "architecture": "amd64" carries a space and a grep for the unspaced form
      # reports a perfectly good manifest as missing. It also has to skip the
      # attestation entries, whose platform is unknown/unknown.
      - name: Both architectures are present
        env:
          REF: ghcr.io/openqtt/openqtt:${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$REF"
          RAW=$(docker buildx imagetools inspect "$REF" --raw)
          for a in amd64 arm64; do
            printf '%s' "$RAW" | jq -e --arg a "$a" '
              [ .manifests[]
                | select(.platform.os == "linux")
                | .platform.architecture
              ] | index($a) != null
            ' >/dev/null || { echo "missing linux/$a in the manifest" >&2; exit 1; }
          done
          echo "linux/amd64 and linux/arm64 both present"

  chart:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/openqtt --set nodeCookie=ci-not-a-real-cookie
      - run: helm package deploy/charts/openqtt --destination dist
      - id: push
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          OUT="$(helm push "dist/openqtt-${{ needs.version.outputs.version }}.tgz" oci://ghcr.io/openqtt/charts 2>&1)"
          echo "$OUT"
          echo "digest=$(echo "$OUT" | sed -n 's/^Digest: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/openqtt-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error

  release:
    needs: [version, manifest, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          OpenQTT $VERSION. Apache 2.0, EMQX 5.8.9 inside, community profile,
          no dashboard UI. The binary is \`openqtt\`, broker variables carry the
          \`OPENQTT_\` prefix, and the image installs to /opt/openqtt.

          | Artifact | Reference |
          | --- | --- |
          | Image | \`ghcr.io/openqtt/openqtt:$VERSION\` |
          | Image (mirror) | \`docker.io/openqtt/openqtt:$VERSION\` |
          | Architectures | \`linux/amd64\`, \`linux/arm64\` |
          | Image digest | \`$IMAGE_DIGEST\` |
          | Chart | \`oci://ghcr.io/openqtt/charts/openqtt:$VERSION\` |
          | Chart digest | \`$CHART_DIGEST\` |

          Deploy the image by digest. The packaged chart is attached below.
          NOTES
          gh release create "v$VERSION" "dist/openqtt-$VERSION.tgz" \
            --title "OpenQTT $VERSION" --notes-file notes.md --verify-tag
