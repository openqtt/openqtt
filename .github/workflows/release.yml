# A tag `vX.Y.Z` is a release. It builds the community image, publishes it and
# the chart to GHCR, and creates the GitHub release with the packaged chart
# attached and both digests in the notes. Deployments pin the image digest, not
# the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  mirror-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the builder image if the mirror is missing
        run: |
          set -euo pipefail
          SRC="ghcr.io/emqx/emqx-builder/5.6-2:1.15.7-26.2.5.14-1-debian13"
          DST="ghcr.io/openqtt/emqx-builder:5.6-2-1.15.7-26.2.5.14-1-debian13"
          if docker manifest inspect "$DST" >/dev/null 2>&1; then
            echo "mirror present: $DST"
          else
            docker buildx imagetools create --tag "$DST" "$SRC"
            echo "mirrored $SRC -> $DST"
          fi

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag must match the chart
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION="$(grep -E '^version:' deploy/charts/openqtt/Chart.yaml | awk '{print $2}')"
          if [ "$VERSION" != "$CHART_VERSION" ]; then
            echo "tag v$VERSION but Chart.yaml says $CHART_VERSION; bump the chart first" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  image:
    needs: [mirror-builder, version]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/openqtt/openqtt:${{ needs.version.outputs.version }}
            ghcr.io/openqtt/openqtt:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/openqtt --set nodeCookie=ci-not-a-real-cookie
      - run: helm package deploy/charts/openqtt --destination dist
      - id: push
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          OUT="$(helm push "dist/openqtt-${{ needs.version.outputs.version }}.tgz" oci://ghcr.io/openqtt/charts 2>&1)"
          echo "$OUT"
          echo "digest=$(echo "$OUT" | sed -n 's/^Digest: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/openqtt-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error

  release:
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          OpenQTT $VERSION. EMQX 5.8.9, Apache 2.0, community profile, no dashboard UI.

          | Artifact | Reference |
          | --- | --- |
          | Image | \`ghcr.io/openqtt/openqtt:$VERSION\` |
          | Image digest | \`$IMAGE_DIGEST\` |
          | Chart | \`oci://ghcr.io/openqtt/charts/openqtt:$VERSION\` |
          | Chart digest | \`$CHART_DIGEST\` |

          Deploy the image by digest. The packaged chart is attached below.
          NOTES
          gh release create "v$VERSION" "dist/openqtt-$VERSION.tgz" \
            --title "OpenQTT $VERSION" --notes-file notes.md --verify-tag
