# OpenQTT 2.0: one workspace, crates under crates/, lowest layer first in the list below.
# `make layers` enforces which crate may depend on which; docs/README.md indexes the design.
[workspace]
resolver = "3"
members = ["crates/*"]
# The codec's fuzz targets are a crate of their own: cargo-fuzz needs a nightly compiler, and
# the gate builds this workspace on the pinned stable one. The spikes are measurements kept
# beside the code, not part of it: each is a crate of its own with exact versions and its own
# lock file, so nothing they pull in reaches the product's.
exclude = ["fuzz", "spikes/s2-routing", "spikes/s4-quinn"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
# Moves with rust-toolchain.toml.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/openqtt/OpenQTT"
# Nothing is published yet. openqtt-codec and openqtt-client are meant for crates.io once their
# API settles; they switch to true then, and nothing else does.
publish = false

[workspace.dependencies]
# The workspace's own crates, so a member names a sibling by name and never by path.
openqtt-codec = { path = "crates/codec" } # MQTT 5 packets over bytes
openqtt-topic = { path = "crates/topic" } # topic names, filters and the matching trie
openqtt-core = { path = "crates/core" } # domain types and session placement
openqtt-ext = { path = "crates/ext" } # the extension traits
openqtt-auth = { path = "crates/auth" } # built-in authentication and authorization
openqtt-session = { path = "crates/session" } # the sans-IO session state machine
openqtt-config = { path = "crates/config" } # the one reader of the environment
openqtt-observe = { path = "crates/observe" } # metric, span and health conventions
openqtt-wire = { path = "crates/wire" } # the protocol between roles
openqtt-transport = { path = "crates/transport" } # the client QUIC listener
openqtt-cluster = { path = "crates/cluster" } # membership and placement
openqtt-log = { path = "crates/log" } # the log role
openqtt-router = { path = "crates/router" } # the router role
openqtt-edge = { path = "crates/edge" } # the edge role
openqtt-admin = { path = "crates/admin" } # the admin role
openqtt-node = { path = "crates/node" } # assembles roles into a process
openqtt-client = { path = "crates/client" } # the MQTT 5 over QUIC client
openqtt-testkit = { path = "crates/testkit" } # test tooling, dev-dependency only

# The command line of the openqtt binary. Not the `env` feature: only openqtt-config reads the
# environment, and clap reading variables behind its back would undo that.
clap = { version = "4.6", features = ["derive"] }
# Structured diagnostics, the one logging API every crate uses. Without `attributes` for now:
# #[instrument] is unused, and its macro crate pins syn 2 beside clap's syn 3.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Writes tracing events as JSON or text, filtered by observability.log_level; only the binary
# installs it. Without `ansi`, which would read NO_COLOR behind the configuration's back.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "json"] }
# One error enum per crate, derived rather than written by hand.
thiserror = "2.0"
# Reference-counted byte buffers. The codec decodes from and encodes into them, and a decoded
# payload is a slice of the buffer it arrived in rather than a copy.
bytes = "1.12"
# A counting global allocator, a dev-dependency only: the client listener's soak test reports
# the heap an idle connection costs against report R7's budget (D1). Implementing one takes the
# unsafe code the workspace forbids. It has no dependencies of its own.
cap = "0.1.2"
# Property tests, a dev-dependency only: random valid packets must round-trip and random bytes
# must never panic the decoder. Without the fork and timeout features, which run each case in
# a child process and bring tempfile and rusty-fork for it.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The settings types derive their reading from TOML and their writing back to it. Never in the
# codec, which stays free of any serialization framework.
serde = { version = "1.0.229", features = ["derive"] }
# TOML: the configuration file's format, the differential harness's list of intended
# divergences, and openqtt-auth's ACL files. Without `preserve_order`, tables keep their keys
# sorted, so errors about a file come out in the same order every time; without `display`, since
# nothing writes TOML through it: the ACL converter writes its TOML by hand, so that each rule
# keeps a comment naming the line it came from.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
# URLs parsed by the WHATWG rules, which openqtt-config checks the OTLP endpoint against. It is
# in the tree anyway, under reqwest.
url = "2.5"
# The OpenTelemetry API, which every crate records metrics on. It records nothing until the
# binary installs a provider, so a library takes only this; openqtt-observe must never take the
# SDK (`make layers`).
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
# The OpenTelemetry SDK: the binary's meter provider, and the in-memory exporter tests read.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics"] }
# Pushes metrics to a collector: OTLP over HTTP with protobuf bodies, on reqwest's blocking
# client, which the SDK's reader calls from a thread of its own with no async runtime. Not gRPC,
# which would bring tonic and want a tokio runtime to export from. `internal-logs` turns a failed
# export into a log line rather than silence.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "metrics", "internal-logs"] }
# The HTTP client under the OTLP exporter, with rustls on aws-lc-rs: the binary's one TLS stack
# and crypto provider (deny.toml, `make layers`). The binary hands it a TLS configuration of its
# own rather than let it read the system's trust store.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# The async runtime QUIC runs on. No default features; each crate names the ones it uses.
tokio = { version = "1.53", default-features = false }
# QUIC (RFC 9000) for the client and the test kit. Without the defaults, which bring ring
# through rustls-ring and a platform certificate verifier: TLS runs on rustls with aws-lc-rs.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
# quinn's protocol crate, for what quinn does not re-export: InvalidCid, with which the client
# listener's connection IDs refuse a packet meant for another node or endpoint. The version quinn
# brings, without its defaults, which would add ring.
quinn-proto = { version = "0.11.19", default-features = false }
# The UDP sockets of the client listener, for SO_REUSEPORT: several endpoints on one port, one per
# core (R7, D7). The version quinn brings, with `all` for set_reuse_port.
socket2 = { version = "0.6.5", features = ["all"] }
# TLS on aws-lc-rs, the one crypto provider (deny.toml bans ring): TLS 1.3 inside QUIC, and the
# OTLP exporter's HTTPS, which may meet a collector that speaks only TLS 1.2. Without the
# defaults, since logging would go through the log crate. With `prefer-post-quantum`, so every
# handshake offers X25519MLKEM768 first, as report R7 decided (D6).
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "prefer-post-quantum"] }
# Throwaway CAs and certificates for tests, signed with aws-lc-rs instead of rcgen's default
# ring.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# The Mozilla root store, trusted for an https collector when observability.otlp.ca_file names
# no CA of its own.
webpki-roots = "1.0"
# JSON: the test kit's traces, and what tests read back from the probes and the logs.
serde_json = "1.0.151"
# The topic index's two tables, the level interner and the child table, store a 32-bit id and
# compare against text and nodes kept elsewhere, which only hashbrown's HashTable allows. That
# is what keeps a filter near 150 bytes (report R6). Without its default hasher: foldhash is
# named below.
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
# The hasher for those tables, seeded at random per index, so that levels chosen to collide in
# one process do not collide in another. Fast on short keys, which topic levels are.
foldhash = "0.2"
# Destination sets above 64 entries, as R3 specifies. Without std, which adds only
# serialization and two dependencies for it.
roaring = { version = "0.11", default-features = false }
# xxh3-64, which places a session on its log partition (openqtt-core's partition_of, R3). Only
# that hash: the default features add four others and a random seed source.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
# The crypto of openqtt-auth outside TLS: PBKDF2-HMAC-SHA256 for password hashes, the salts'
# random bytes, and SHA-256 for a pinned CA's fingerprint. aws-lc-rs is already the one crypto
# provider (deny.toml bans ring); these are the features rustls turns on, so nothing new is
# built.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The salt and hash of a PHC string, in base64 without padding. The version and features rcgen's
# pem already brings, so not the default simd-unsafe.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
# Client certificates for identity: the subject CN, the extended key usage and the key
# identifiers (R2 rules 2 to 4). verify-aws checks a signature with aws-lc-rs, to find the CA
# that really issued a leaf; its other feature, verify, would bring ring.
x509-parser = { version = "0.18.1", default-features = false, features = ["verify-aws"] }
# The user name and client identifier patterns of the ACL. Linear time in the input, whatever the
# pattern, so a rule cannot be written that a client's name makes slow.
regex = "1.12"
# The literals every match of a pattern begins with, so the 1.x converter can tell whether an ACL
# pattern may match the names reserved for services. The version regex already brings.
regex-syntax = "0.8.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Tests may unwrap (clippy.toml allow-unwrap-in-tests); code that runs in the broker says why it
# cannot fail with expect, or handles the error.
unwrap_used = "warn"
# A codec that silently truncates a length is a protocol bug; convert with try_from instead.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# An allow without a reason is a decision nobody can review.
allow_attributes_without_reason = "warn"
# Libraries log through tracing; only the binary writes to the terminal, and it says so.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A library that exits takes the broker down with it; return an error instead.
exit = "warn"
