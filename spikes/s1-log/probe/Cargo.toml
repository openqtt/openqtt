[package]
name = "s1-probe"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Spike S1: compile time and binary size each storage engine adds"

# Built once per feature from a clean target directory; `none` is the baseline.
[features]
none = []
fjall = ["dep:fjall"]
redb = ["dep:redb"]
rocksdb = ["dep:rocksdb"]
openraft = ["dep:openraft"]

[dependencies]
fjall = { version = "=3.1.10", optional = true }
redb = { version = "=4.3.0", optional = true }
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["lz4", "bindgen-runtime"] }
openraft = { version = "=0.9.25", optional = true, default-features = false, features = ["storage-v2"] }
