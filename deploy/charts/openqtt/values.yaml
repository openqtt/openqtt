## Default values for openqtt.
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.

## An odd number of nodes is recommended; otherwise the cluster cannot heal
## itself automatically after a net-split.
replicaCount: 3
image:
  repository: ghcr.io/openqtt/openqtt
  pullPolicy: IfNotPresent
  ## The image tag defaults to the CHART version (the OpenQTT version), not to
  ## appVersion. appVersion is the EMQX version inside the image (5.8.9) and is
  ## never published as a tag.
  tag: ""
  ## Pin by digest instead of tag. When set, this wins over `tag`.
  ## Example: sha256:0123abcd...
  digest: ""
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  # pullSecrets:
  # - myRegistryKeySecretName

serviceAccount:
  # Specifies whether a service account should be created
  # If set false, means you need create service account by yourself
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Annotations to add to the service account
  annotations: {}

## Credentials. These are rendered into a chart-managed Secret and injected as
## environment variables AFTER the ConfigMap, so they never appear in the
## ConfigMap and they win at runtime. Never put these keys in `openqttConfig`:
## every key there is serialised verbatim into a world-readable ConfigMap.

## The Erlang distribution cookie. Every node in the cluster must share it, and
## anything that can reach port 4370 knowing it gets a distribution connection,
## which is remote code execution inside the broker. There is deliberately no
## default: the chart refuses to render without it. Generate one with
##   openssl rand -hex 32
nodeCookie: ""

## Initial password for the REST API `admin` user. Leave empty to keep the
## upstream default of `public`, which you should only do for a throwaway
## cluster.
dashboardPassword: ""

# The name of a secret in the same kubernetes namespace which contains values to
# be added to the environment (must be manually created). Applied after the
# chart-managed Secret above, so it can override anything here.

# envFromSecret: "openqtt-secrets"

## Forces the recreation of pods during helm upgrades. This can be useful to update configuration values even if the container image did not change.
recreatePods: false

## Sets the minReadySeconds parameter on the stateful set. This can be used to add delay between restart / updates between the single pods.
minReadySeconds:

## Sets the priorityClassName parameter on the pods. This can be used to run the pods with increased priority.
priorityClassName:

clusterDomain: cluster.local

## Custom annotations to be added to the pods
podAnnotations: {}

## Custom labels to be added to the pods
podLabels: {}

# Pod deployment policy
# value: OrderedReady | Parallel
# To redeploy a chart with existing PVC(s), the value must be set to Parallel to avoid deadlock
podManagementPolicy: Parallel

## What lives in /opt/openqtt/data: the Mnesia/Mria disc tables (REST API users,
## built-in authn/authz) and cluster.hocon, which is where every config change
## made through the REST API is persisted. With persistence off a rolling
## restart is survivable, but a full cluster stop loses all of it.
##
## RETAINED MESSAGES ARE NOT IN THAT LIST BY DEFAULT, and this comment used to
## say they were. `retainer.backend.storage_type` defaults to `ram`
## (emqx_retainer_schema.erl:138-143), which makes the table `ram_copies`, so a
## volume here does not save it and a full cluster stop loses every retained
## message however this is set. Set `storage_type = disc` as well if you are
## keeping anything in the retained store that has to survive.
##
## Changing it on a running cluster is safe: `emqx_retainer_mnesia.erl:190-200`
## calls `mnesia:change_table_copy_type/3` when the configured type differs from
## the one on disc, so it converts in place rather than starting empty.
persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce
  ## Existing PersistentVolumeClaims
  ## The value is evaluated as a template
  ## So, for example, the name can depend on .Release or .Chart
  # existingClaim: ""

## Defaults are the measured values from our own three-node deployment. With
## `resources: {}` the pods are BestEffort: first evicted under node pressure,
## and no CPU reservation for the BEAM schedulers.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
  # unused-example:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 500m
  #   memory: 512Mi

extraVolumeMounts: []
## Additional volumeMounts to the default backend container.
#  - name: my-owner-acl
#    mountPath: /opt/openqtt/etc/acl.conf
#    subPath: acl.conf

extraVolumes: []
## Additional volumes to the default backend pod.
#  - name: my-owner-acl
#    secret:  fake-acl-conf

# Containers that run before the creation of OpenQTT containers. They can contain utilities or setup scripts.
initContainers: {}
  # - name: sysctl
  #   image: busybox
  #   securityContext:
  #     runAsUser: 0
  #     runAsGroup: 0
  #     capabilities:
  #       add:
  #       - SYS_ADMIN
  #       drop:
  #       - ALL
  #   command:
  #     - /bin/sh
  #     - -c
  #     - |
  #       mount -o remount rw /proc/sys
  #       sysctl -w net.core.somaxconn=65535
