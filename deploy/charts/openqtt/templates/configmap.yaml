{{- /*
Every key under .Values.emqxConfig is written verbatim into this ConfigMap, which
is world-readable to anything with get on configmaps and ends up in GitOps repos
and backups. Refuse the two keys that must never land here; both have dedicated
values that route to a Secret instead.
*/ -}}
{{- range $k, $v := .Values.emqxConfig }}
{{- if or (eq (upper (toString $k)) "EMQX_NODE__COOKIE") (eq (upper (toString $k)) "EMQX_DASHBOARD__DEFAULT_PASSWORD") }}
{{- fail (printf "\n\nopenqtt: emqxConfig.%s would be written into a world-readable ConfigMap.\n\nUse the dedicated value instead, which routes to a Secret:\n    EMQX_NODE__COOKIE                 -> nodeCookie\n    EMQX_DASHBOARD__DEFAULT_PASSWORD  -> dashboardPassword\n" $k) }}
{{- end }}
{{- end }}
{{- if .Values.emqxConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "emqx.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "emqx.name" . }}
    helm.sh/chart: {{ include "emqx.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  EMQX_NAME:  {{ .Release.Name }}
  {{- if eq (.Values.emqxConfig.EMQX_CLUSTER__DISCOVERY_STRATEGY)  "k8s"  }}
  EMQX_CLUSTER__K8S__APISERVER: "https://kubernetes.default.svc:443"
  EMQX_CLUSTER__K8S__SERVICE_NAME:  {{ include "emqx.fullname" . }}-headless
  EMQX_CLUSTER__K8S__NAMESPACE: {{ .Release.Namespace }}
  EMQX_CLUSTER__K8S__ADDRESS_TYPE: "hostname"
  EMQX_CLUSTER__K8S__SUFFIX: "svc.{{ .Values.clusterDomain }}"
  {{- else if eq (.Values.emqxConfig.EMQX_CLUSTER__DISCOVERY_STRATEGY)  "dns"  }}
  EMQX_CLUSTER__DNS__NAME: "{{  include "emqx.fullname" . }}-headless.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"
  EMQX_CLUSTER__DNS__RECORD_TYPE: "srv"
  {{- end -}}
  {{- range $index, $value := .Values.emqxConfig }}
  {{- if $value }}
  {{- $key := (regexReplaceAllLiteral "\\." (regexReplaceAllLiteral "EMQX[_\\.]" (upper (trimAll " " $index)) "") "__") }}
  {{- if or (kindIs "map" $value) (kindIs "slice" $value) }}
  {{ print "EMQX_" $key }}: {{ tpl (printf "%q" (toJson $value)) $ }}
  {{- else }}
  {{ print "EMQX_" $key }}: "{{ tpl (printf "%v" $value) $ }}"
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
