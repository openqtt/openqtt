{{- /*
Credentials the broker must not read from a ConfigMap.

`nodeCookie` is the Erlang distribution secret. Every node must share it, and
anything that reaches port 4370 knowing it gets a distribution connection, which
is code execution inside the broker. The image ships a public default
("emqxsecretcookie", in EMQX's git history), so an unset cookie is not a missing
feature, it is a known-credential cluster. The chart refuses to render instead.
*/ -}}
{{- if and (not .Values.nodeCookie) (not .Values.envFromSecret) }}
{{- fail "\n\nopenqtt: nodeCookie is required.\n\nThe Erlang distribution cookie has no safe default: the image falls back to the\npublicly known \"emqxsecretcookie\", and anyone who can reach port 4370 with it\ngets code execution inside the broker.\n\nSet one:\n    --set nodeCookie=$(openssl rand -hex 32)\n\nor supply OPENQTT_NODE__COOKIE yourself through a Secret named by envFromSecret.\n" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openqtt.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "openqtt.name" . }}
    helm.sh/chart: {{ include "openqtt.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- with .Values.nodeCookie }}
  OPENQTT_NODE__COOKIE: {{ . | quote }}
  {{- end }}
  {{- with .Values.dashboardPassword }}
  OPENQTT_DASHBOARD__DEFAULT_PASSWORD: {{ . | quote }}
  {{- end }}
{{- if .Values.metrics.enabled }}
---
{{- /*
basicAuth for the ServiceMonitor. It must carry the password the broker actually
uses, so it reads the same value the credentials Secret does rather than the
upstream default, which would 401 every scrape.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openqtt.fullname" . }}-basic-auth
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.openqttConfig.OPENQTT_DASHBOARD__DEFAULT_USERNAME | default "admin" | quote }}
  password: {{ .Values.dashboardPassword | default "public" | quote }}
{{- end }}
