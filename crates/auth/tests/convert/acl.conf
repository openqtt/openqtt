%% A synthetic acl.conf in the style of an OpenQTT 1.x deployment, for the converter's golden
%% test. Devices connect with a certificate whose CN is their user name, under the mountpoint
%% ingest/${username}/, so their rules name their own topics; services connect with passwords
%% and are named svc:<name>. No name here is a real one.

%% The platform's services.
{allow, {username, {re, "^svc:"}}, all, ["#"]}.
{allow, {'and', [{username, "svc:bridge"}, {ipaddrs, ["10.0.0.0/8", "fd00::/8"]}]},
    publish, ["ingest/+/commands/#"]}.

%% Monitoring from inside the cluster.
{allow, {ipaddr, "127.0.0.1"}, subscribe, ["$SYS/#"]}.

%% Devices never send commands and never retain.
{deny, all, publish, ["commands/#"]}.
{deny, all, {publish, [{retain, true}]}, ["#"]}.
{allow, all, {publish, [{qos, [0, 1]}]}, ["telemetry/#", "events/+/state"]}.
{allow, all, subscribe, ["commands/#", {eq, "config/${clientid}"}]}.

%% Dashboards of the old platform.
{allow, {'or', [{username, "dashboard"}, {clientid, {re, "^dash-[0-9]+$"}}]},
    subscribe, ["ingest/#", "eq #"]}.
{allow, {username, <<"ops">>}, all, all}.

%% Devices of the old namespace keep their own topics.
{allow, {clientid, {re, "legacy-\\d+"}}, {all, [{qos, 1}, {retain, false}]},
    ["legacy/${clientid}/#", "a/#/b"]}.
{deny, {ipaddr, "192.0.2.77/24"}, all, all}.

{deny, all}.
